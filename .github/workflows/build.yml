name: Build
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ "master", "stable" ]
  pull_request:
    branches: [ "master", "stable" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Validate OpenAPI definition
      run: npx -y @redocly/cli lint --config=.redocly.yaml --max-problems=0 snapraidd.yaml
    - name: Lint YAML with yamllint (strict)
      run: |
        pip install yamllint
        yamllint --strict -c .yamllint.yml snapraidd.yaml
    - run: autoreconf -i
    - run: ./configure
    - run: make distcheck
  build-win:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-zstd autoconf automake make zip
      - run: autoreconf -i
      - run: ./configure --enable-warning-as-error
      - run: make all dist check
      - name: Package Windows executable and runtime DLLs
        run: |
          mkdir -p snapraidd-package
          cp snapraidd.exe snapraidd-package/
          ldd snapraidd.exe | tee snapraidd-dependencies.txt
          if grep -qi 'not found' snapraidd-dependencies.txt; then
            echo "::error::A snapraidd.exe runtime dependency could not be resolved."
            exit 1
          fi
          mapfile -t runtime_dlls < <(awk '$2 == "=>" && $3 ~ /^\/mingw64\/bin\// { print $3 }' snapraidd-dependencies.txt | sort -u)
          for dll in "${runtime_dlls[@]}"; do
            cp "$dll" snapraidd-package/
          done
          if ! compgen -G 'snapraidd-package/*zstd*.dll' > /dev/null; then
            echo "::error::The zstd runtime DLL was not included in the package."
            exit 1
          fi
      - name: Upload Windows daemon executable
        uses: actions/upload-artifact@v4
        with:
          name: snapraidd-windows-x64
          path: snapraidd-package/
          if-no-files-found: error
          retention-days: 7
